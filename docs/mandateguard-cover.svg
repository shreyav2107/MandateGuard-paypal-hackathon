<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">MandateGuard — clarity before commitment</title>
  <desc id="desc">A green shield beside MandateGuard and a sample comparison of an expected ten-dollar monthly price with a sixty-nine dollar and ninety-nine cent offer.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbf9"/>
      <stop offset="0.55" stop-color="#f2f8f4"/>
      <stop offset="1" stop-color="#e7f3ec"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15755e"/>
      <stop offset="1" stop-color="#45b889"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e5f3eb" stop-opacity="0"/>
      <stop offset="1" stop-color="#d5eee1" stop-opacity=".62"/>
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173c30" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1600" height="360" rx="28" fill="url(#background)"/>
  <rect x="780" width="820" height="360" rx="28" fill="url(#wash)"/>

  <g transform="translate(95 65) scale(.86)">
    <path d="M100 0 188 33v67c0 66-37 112-88 143-51-31-88-77-88-143V33L100 0Z" fill="url(#shield)"/>
    <path d="m58 103 29 29 57-62" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="18"/>
  </g>

  <text x="300" y="137" fill="#17362d" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" letter-spacing="-.8">MandateGuard</text>
  <text x="304" y="186" fill="#19785f" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="4">CLARITY BEFORE COMMITMENT</text>
  <text x="304" y="238" fill="#53675e" font-family="Arial, Helvetica, sans-serif" font-size="25">Know what you’re saying yes to.</text>

  <g filter="url(#card-shadow)">
    <rect x="1000" y="58" width="520" height="244" rx="24" fill="#ffffff" stroke="#dce9e1" stroke-width="2"/>
    <circle cx="1036" cy="95" r="6" fill="#2e9a72"/>
    <text x="1053" y="101" fill="#29463b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.7">BEFORE YOU APPROVE</text>
    <path d="M1030 121H1490" stroke="#e7eee9" stroke-width="2"/>

    <text x="1032" y="158" fill="#75877e" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">YOU EXPECT</text>
    <text x="1032" y="194" fill="#17362d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">≤ $10 / month</text>

    <path d="M1275 143V207" stroke="#e7eee9" stroke-width="2"/>

    <text x="1300" y="158" fill="#75877e" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">OFFER TERMS</text>
    <text x="1300" y="194" fill="#17362d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">$69.99 / month</text>

    <rect x="1030" y="225" width="176" height="36" rx="18" fill="#fff1e8"/>
    <circle cx="1049" cy="243" r="5" fill="#c96a38"/>
    <text x="1062" y="248" fill="#a85025" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing=".4">PRICE MISMATCH</text>
    <text x="1222" y="248" fill="#72847a" font-family="Arial, Helvetica, sans-serif" font-size="14">Review before you approve.</text>
  </g>
</svg>
